workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule"'
    # Feature pushes (including those with an open MR) have no branch pipeline.
    # Keep protected-branch history and explicitly requested pipelines enabled.
    - when: never

stages: [verify]
variables:
  GIT_DEPTH: "0"
  DEBIAN_FRONTEND: noninteractive
  PYTHONDONTWRITEBYTECODE: "1"

verify-fast:
  image: ros:jazzy-ros-base-noble
  stage: verify
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git cmake build-essential python3-colcon-common-extensions python3-pytest python3-yaml ros-jazzy-ament-cmake-pytest ros-jazzy-tf2-ros-py
    - |
      revision=$(python3 -c 'import yaml; print(yaml.safe_load(open("ci/dependencies.repos"))["repositories"]["dream_interfaces"]["version"])')
      mkdir -p .verification/dependencies
      git clone --no-checkout "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.unimelb.edu.au/dream/dream_interfaces.git" .verification/dependencies/dream_interfaces
      git -C .verification/dependencies/dream_interfaces checkout --detach "$revision"
      git -C .verification/dependencies/dream_interfaces remote set-url origin https://gitlab.unimelb.edu.au/dream/dream_interfaces.git
    - rosdep update
    - rosdep install --from-paths . .verification/dependencies/dream_interfaces --ignore-src -r -y --rosdistro jazzy
  script:
    - AI4R_INTERFACES_SOURCE="$CI_PROJECT_DIR/.verification/dependencies/dream_interfaces" bash tools/verify_fast.sh
  artifacts:
    when: always
    paths: [.verification/ws/log/, .verification/ws/build/ai4r_policy/test_results/]
    reports:
      junit: .verification/ws/build/ai4r_policy/test_results/**/*.xml
    expire_in: 14 days

# Protected-branch checks validate merge topology rather than rerunning the
# already-verified MR's entire ROS suite. Final release/tag packaging is added
# during the separately reviewed first release preparation, not claimed here.
verify-history:
  image: alpine:3.21
  stage: verify
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
  before_script:
    - apk add --no-cache git
  script:
    - git diff-tree --root -m --check HEAD
    - git fetch --no-tags origin main dev
    - |
      if [ "${CI_PIPELINE_SOURCE}" = merge_request_event ]; then
        git merge-base --is-ancestor origin/dev HEAD
        git diff --exit-code origin/dev HEAD
      else
        test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
        git merge-base --is-ancestor HEAD^1 HEAD^2
        if [ "$CI_COMMIT_BRANCH" = main ]; then
          git diff --exit-code HEAD^2 HEAD
        fi
      fi
